      description: Requer discounts.validate. Somente ficha PAID com caixa ainda ABERTO; após o fechamento o estorno é bloqueado. Cancelar ficha paga sem estorno prévio retorna 422.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 1000 } } } } } }
      responses:
        '201': { description: Estorno registrado e auditado }
        '403': { description: Requer discounts.validate }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/patients/lookup:
    post:
      summary: Localiza paciente por CPF normalizado, sem incluir CPF em URL
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [cpf], properties: { cpf: { type: string } } } } } }
      responses:
        '200': { description: Dados mínimos do paciente ou data nulo }
        '403': { description: Requer appointments.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/loyalty/plans:
    get:
      summary: Lista planos Sou DEZ (programa de fidelidade)
      description: Requer soudez.view. Plano vincula um convênio (ex. SOU DEZ COMPLETO), mensalidade e dia de vencimento; assinante ativo/adimplente usa a tabela do convênio.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Planos com contagem de assinaturas ativas }
        '403': { description: Requer soudez.view }
    post:
      summary: Cria plano Sou DEZ vinculado a um convênio
      description: Requer soudez.manage. Um convênio aceita apenas um plano; Particular padrão não é permitido. Auditado.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoyaltyPlanInput' }
      responses:
        '201': { description: Plano criado }
        '403': { description: Requer soudez.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/loyalty/plans/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Atualiza mensalidade, dia de vencimento, nome ou situação do plano
      description: Requer soudez.manage. Auditado.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoyaltyPlanInput' }
      responses:
        '200': { description: Plano atualizado }
        '403': { description: Requer soudez.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/loyalty/subscriptions:
    get:
      summary: Lista assinaturas Sou DEZ (titular + dependentes + mensalidades)
      description: Requer soudez.view. Busca por nome (ilike) ou CPF (11 dígitos) do titular ou dependente.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [ACTIVE, CANCELED, BLOCKED] } }
        - { name: search, in: query, schema: { type: string, maxLength: 120 } }
      responses:
        '200': { description: Assinaturas }
        '403': { description: Requer soudez.view }
    post:
      summary: Cria assinatura (titular por CPF + dependentes) e gera a mensalidade do mês
      description: Requer soudez.manage. Paciente novo é cadastrado (LGPD, CPF hash+pepper). Um paciente não pode ter duas assinaturas ativas. Auditado.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoyaltySubscriptionInput' }
      responses:
        '201': { description: Assinatura criada }
        '403': { description: Requer soudez.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/loyalty/subscriptions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Detalhe da assinatura com dependentes e mensalidades
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Assinatura }
        '403': { description: Requer soudez.view }
    patch:
      summary: Altera status (reativar/cancelar/bloquear), notas e sincroniza dependentes
      description: Requer soudez.manage. Reativação falha se o paciente estiver em outra assinatura ativa. Dependentes sincronizados por lista completa; omitir o campo mantém os atuais. Auditado.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoyaltySubscriptionUpdate' }
      responses:
        '200': { description: Assinatura atualizada }
        '403': { description: Requer soudez.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/loyalty/dues:
    get:
      summary: Lista mensalidades (pendentes, pagas ou atrasadas)
      description: Requer soudez.view. Atraso = PENDENTE com vencimento anterior a hoje.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [PENDENTE, PAGA] } }
        - { name: overdue, in: query, schema: { type: boolean } }
      responses:
        '200': { description: Mensalidades }
        '403': { description: Requer soudez.view }
  /team/loyalty/dues/{id}/collect:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Recebe a mensalidade no caixa (movimento tipo MENSALIDADE)
      description: Requer soudez.view + cash.operate. Exige caixa ABERTO na unidade; entra no fechamento consolidado por forma de pagamento; gera a mensalidade do mês seguinte. Auditado.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payment_method_code, unit_id]
              properties:
                payment_method_code: { type: string, maxLength: 20 }
                unit_id: { type: string, format: uuid }
      responses:
        '201': { description: Mensalidade paga }
        '403': { description: Requer cash.operate }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/loyalty/eligibility:
    get:
      summary: Verifica elegibilidade Sou DEZ do paciente para um convênio
      description: Requer soudez.view. Avalia assinatura ativa (titular/dependente) e ausência de mensalidade em atraso; convênio sem plano é sempre elegível.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: agreement_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: patient_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Elegibilidade e motivo }
        '403': { description: Requer soudez.view }
  /team/mt/options:
    get:
      summary: Opções do módulo Medicina do Trabalho (§6.7)
      description: Empresas (convênios ativos), riscos, setores e funções para os seletores. Requer mt.view.
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '200': { description: Catálogo de opções do MT }
        '403': { description: Requer mt.view }
  /team/mt/risks:
    get:
      summary: Lista riscos ocupacionais
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '200': { description: Riscos (ativos por padrão) }
    post:
      summary: Cria risco ocupacional
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
      responses:
        '201': { description: Risco criado }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/mt/risks/{id}:
    put:
      summary: Renomeia/ativa-inativa risco
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '200': { description: Risco atualizado }
  /team/mt/sectors:
    get:
      summary: Lista setores por empresa
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      parameters:
        - { name: agreement_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Setores }
    post:
      summary: Cria setor (empresa + nome, §6.7)
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '201': { description: Setor criado }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/mt/sectors/{id}:
    put:
      summary: Atualiza setor
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '200': { description: Setor atualizado }
  /team/mt/functions:
    get:
      summary: Lista funções (por empresa/setor)
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '200': { description: Funções }
    post:
      summary: Cria função (setor + risco + nome)
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '201': { description: Função criada }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/mt/functions/{id}:
    put:
      summary: Atualiza função
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '200': { description: Função atualizada }
  /team/mt/asos:
    get:
      summary: Lista ASOs com filtros (§6.7)
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      parameters:
        - { name: agreement_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [PENDENTE, AGENDADO, EMITIDO, CANCELADO] } }
        - { name: type, in: query, schema: { type: string, enum: [ADMISSIONAL, PERIODICO, RETORNO_AO_TRABALHO, MUDANCA_DE_FUNCAO, DEMISSIONAL] } }
        - { name: due_from, in: query, schema: { type: string, format: date } }
        - { name: due_to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string, description: Busca por nome do funcionário } }
      responses:
        '200': { description: ASOs paginados }
    post:
      summary: Cadastra ASO (funcionário + empresa + setor/função/riscos + tipo)
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '201': { description: ASO criado com evento CRIADO }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/mt/asos/due:
    get:
      summary: Vencimentos de ASOs periódicos (janela configurável MT_DUE_WARNING_DAYS)
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      parameters:
        - { name: days, in: query, schema: { type: integer } }
        - { name: agreement_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: ASOs a vencer/vencidos com flags }
  /team/mt/asos/{id}:
    put:
      summary: Edita ASO (setor/função/risco/tipo/observações)
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '200': { description: ASO atualizado com evento EDITADO }
  /team/mt/asos/{id}/cancel:
    post:
      summary: Cancela ASO com motivo (nada é apagado)
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '200': { description: ASO cancelado }
  /team/mt/asos/{id}/extend:
    post:
      summary: Prorroga validade (PRORROGADO)
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '200': { description: Validade prorrogada }
  /team/mt/asos/{id}/link-exam:
    post:
      summary: Vincula atendimento/exame ao ASO
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '200': { description: ASO vinculado (VINCULADO_EXAME) }
  /team/mt/asos/{id}/emit:
    post:
      summary: Emite ASO como laudo (reusa o motor de laudos; variáveis {{SETOR}}, {{FUNCAO}}, {{RISCO}}, {{TIPO_ASO}}, {{EMPRESA}})
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '201': { description: Laudo criado em rascunho + ASO EMITIDO }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/mt/batch-schedule:
    post:
      summary: Agendamento em lote por empresa (§6.7) — um item por funcionário, conflitos reportados por item
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '200': { description: Resultado por item (ok/erro) }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/mt/companies/{agreement}/report:
    get:
      summary: Relatório por empresa (ASOs por status/tipo, vencidos, a vencer, atendimentos do período)
      security: [{ cookieAuth: [] }]
      tags: [medicina-trabalho]
      responses:
        '200': { description: Relatório consolidado da empresa }
  /team/analytics:
    get:
      summary: KPIs de relatórios/BI (§6.13) — produção, receita, no-show, ticket, mix de pagamento, caixa, B2B em aberto, fila, ASOs a vencer
      security: [{ cookieAuth: [] }]
      tags: [relatorios]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: unit_id, in: query, schema: { type: string, format: uuid } }
        - { name: doctor_id, in: query, schema: { type: string, format: uuid } }
        - { name: agreement_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Consolidado do período }
        '403': { description: Requer analytics.view }
  /team/analytics/export:
    get:
      summary: Exportação CSV (type=production|revenue|b2b_open|asos_due)
      security: [{ cookieAuth: [] }]
      tags: [relatorios]
      parameters:
        - { name: type, in: query, required: true, schema: { type: string, enum: [production, revenue, b2b_open, asos_due] } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: agreement_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Arquivo CSV (UTF-8 BOM)
          content:
            text/csv:
              schema: { type: string }
  /team/agents:
    get:
      summary: Lista tokens de agentes Hermes (§6.14)
      security: [{ cookieAuth: [] }]
      tags: [hermes]
      responses:
        '200': { description: Tokens (sem hash/plaintext) }
        '403': { description: Requer team.manage }
    post:
      summary: Cria token de agente (plaintext exibido uma única vez)
      security: [{ cookieAuth: [] }]
      tags: [hermes]
      responses:
        '201': { description: Token criado }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/agents/{id}/revoke:
    post:
      summary: Revoga token de agente (auditado)
      security: [{ cookieAuth: [] }]
      tags: [hermes]
      responses:
        '200': { description: Token revogado }
  /agents/agenda:
    get:
      summary: "[Hermes] Agenda por período (escopo agenda.read)"
      security: [{ agentToken: [] }]
      tags: [hermes]
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: unit_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Agendamentos do período }
        '401': { description: Token ausente/inválido/revogado }
        '403': { description: Sem o escopo }
  /agents/patients:
    get:
      summary: "[Hermes] Identificação do paciente por CPF (escopo patients.read)"
      security: [{ agentToken: [] }]
      tags: [hermes]
      parameters:
        - { name: cpf, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Dados de identificação (ou null) }
  /agents/production:
    get:
      summary: "[Hermes] Produção/receita por período (escopo finance.read)"
      security: [{ agentToken: [] }]
      tags: [hermes]
      responses:
        '200': { description: Consolidado de produção }
  /agents/cash-summary:
    get:
      summary: "[Hermes] Resumo de caixa do dia (escopo finance.read)"
      security: [{ agentToken: [] }]
      tags: [hermes]
      responses:
        '200': { description: Caixa consolidado do dia }
  /agents/b2b-invoices:
    get:
      summary: "[Hermes] Faturas B2B em aberto (escopo finance.read)"
      security: [{ agentToken: [] }]
      tags: [hermes]
      responses:
        '200': { description: Faturas em aberto }
  /agents/asos/due:
    get:
      summary: "[Hermes] ASOs a vencer (escopo mt.read)"
      security: [{ agentToken: [] }]
      tags: [hermes]
      responses:
        '200': { description: ASOs vencidos/a vencer }
components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
      description: Token de agente Hermes (§6.14, formato dez_…), criado no módulo de gestão; hash HMAC armazenado, escopos por token, toda requisição auditada.
    managementToken:
      type: http
      scheme: bearer
      bearerFormat: 64 hexadecimal characters
      description: Credencial privada da reserva, entregue somente na criação/repetição idempotente; não é uma sessão da equipe. Link frontend usa fragmento, nunca query string.
    cookieAuth:
      type: apiKey
      in: cookie
      name: sistema_dez_session
    portalToken:
      type: http
      scheme: bearer
      description: Token temporário do portal de resultados (§6.19), emitido no login da credencial impressa.
  schemas:
    ServiceOfferingInput:
      type: object
      required: [catalog_link_id, procedure_price_id, booking_mode, modality, arrival_block_minutes, arrival_block_capacity, active]
      properties:
        catalog_link_id: { type: string, format: uuid }
        procedure_price_id: { type: string, format: uuid }
        booking_mode: { type: string, enum: [FIXED_SLOT, ARRIVAL_BLOCK, WALK_IN_INFO] }
        modality: { $ref: '#/components/schemas/Modality' }
        duration_override_minutes: { type: [integer, 'null'], minimum: 1, maximum: 480 }
        daily_capacity: { type: [integer, 'null'], minimum: 1, maximum: 1000 }
        arrival_block_minutes: { type: integer, minimum: 1, maximum: 480 }
        arrival_block_capacity: { type: integer, minimum: 1, maximum: 1000 }
        active: { type: boolean }
    ServiceOffering:
      allOf:
        - { $ref: '#/components/schemas/ServiceOfferingInput' }
        - type: object
          properties:
            id: { type: string, format: uuid }
            price: { type: string }
            online_enabled: { type: boolean, description: Visível no site quando verdadeiro; ofertas do convênio padrão com vínculo, preço e escala válidos ligam sozinhas, salvo pausa manual. }
            online_paused: { type: boolean, description: Pausa manual da equipe (opt-out); impede a visibilidade automática. }
            published_at: { type: [string, 'null'], format: date-time }
            unit: { $ref: '#/components/schemas/NamedEntity' }
            procedure: { $ref: '#/components/schemas/NamedEntity' }
            professional: { $ref: '#/components/schemas/NamedEntity' }
            agreement: { $ref: '#/components/schemas/NamedEntity' }
            schedule_windows: { type: array, items: { $ref: '#/components/schemas/ScheduleWindow' } }
            schedule_exceptions: { type: array, items: { $ref: '#/components/schemas/ScheduleException' } }
    ScheduleWindow:
      allOf:
        - { $ref: '#/components/schemas/ScheduleWindowInput' }
        - { type: object, required: [id], properties: { id: { type: string, format: uuid } } }
    ScheduleException:
      allOf:
        - { $ref: '#/components/schemas/ScheduleExceptionInput' }
        - { type: object, required: [id], properties: { id: { type: string, format: uuid } } }
    ScheduleWindowInput:
      type: object
      required: [effective_from, weekday, starts_at, ends_at, active]
      properties:
        effective_from: { type: string, format: date }
        effective_to: { type: [string, 'null'], format: date }
        weekday: { type: integer, minimum: 0, maximum: 6 }
        starts_at: { type: string, description: HH:mm na escrita; HH:mm:ss na leitura }
        ends_at: { type: string, description: HH:mm na escrita; HH:mm:ss na leitura }
        slot_minutes: { type: [integer, 'null'], minimum: 1, maximum: 480 }
        daily_capacity_override: { type: [integer, 'null'], minimum: 1, maximum: 1000 }
        active: { type: boolean }
    ScheduleExceptionInput:
      type: object
      required: [date, reason, blocked]
      properties:
        date: { type: string, format: date }
        starts_at: { type: [string, 'null'], description: Ambos os horários nulos bloqueiam o dia inteiro }
        ends_at: { type: [string, 'null'] }
        reason: { type: string, minLength: 3, maxLength: 255 }
        blocked: { type: boolean }
    NamedEntity:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    PublicAppointment:
      type: object
      required: [id, status, scheduled_at, booking_mode, service, price, can_cancel, can_reschedule, unit, professional, agreement]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [CONFIRMED, CHECKED_IN, DONE, CANCELLED] }
        scheduled_at: { type: string, format: date-time }
        recommended_arrival_at: { type: [string, 'null'], format: date-time }
        booking_mode: { type: string, enum: [FIXED_SLOT, ARRIVAL_BLOCK, WALK_IN_INFO] }
        service:
          type: object
          required: [offering_id, procedure_id, procedure_name]
          properties:
            offering_id: { type: string, format: uuid }
            procedure_id: { type: string, format: uuid }
            procedure_name: { type: string }
        price: { type: string }
        management_token: { type: string, pattern: '^[a-f0-9]{64}$', description: Somente criação/repetição idempotente; armazenar link com segurança. }
        management_expires_at: { type: [string, 'null'], format: date-time }
        can_cancel: { type: boolean }
        can_reschedule: { type: boolean }
        unit: { $ref: '#/components/schemas/NamedEntity' }
        professional: { anyOf: [{ $ref: '#/components/schemas/NamedEntity' }, { type: 'null' }] }
        agreement: { $ref: '#/components/schemas/NamedEntity' }
    AgreementPublicationPolicy:
      type: object
      description: Campos adicionais aceitos e retornados no cadastro administrativo de convênios.
      properties:
        online_enabled: { type: boolean }
        requires_authorization: { type: boolean, default: false, description: Exige guia/autorização; impede publicação e reserva online. }
    TeamAppointment:
      type: object
      required: [id, offering_id, scheduled_at, ends_at, status, origin, price]
      properties:
        id: { type: string, format: uuid }
        offering_id: { type: string, format: uuid }
        scheduled_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [CONFIRMED, CHECKED_IN, DONE, CANCELLED] }
        kind: { type: string }
        origin: { type: string }
        price: { type: string }
        patient_name: { type: [string, 'null'] }
        cancellation_reason: { type: [string, 'null'] }
        professional: { anyOf: [{ $ref: '#/components/schemas/NamedEntity' }, { type: 'null' }] }
        procedure: { $ref: '#/components/schemas/NamedEntity' }
        unit: { $ref: '#/components/schemas/NamedEntity' }
        agreement: { $ref: '#/components/schemas/NamedEntity' }
        payment_status: { type: string, enum: [PENDING, PAID, AUTHORIZED] }
        paid_at: { type: [string, 'null'], format: date-time }
        payment_method_code: { type: [string, 'null'] }
        receipt_number: { type: [integer, 'null'] }
        care_started_at: { type: [string, 'null'], format: date-time }
    PaymentMethod:
      type: object
      required: [id, code, name, extra_percent, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, enum: [ESPECIE, DEBITO, CREDITO, PIX] }
        name: { type: string }
        extra_percent: { type: string, description: Percentual extra sobre o preço congelado, definido no cadastro. }
        active: { type: boolean }
    CashRegister:
      type: object
      required: [id, unit_id, shift, float_amount, status, opened_at, last_receipt_number]
      properties:
        id: { type: string, format: uuid }
        unit_id: { type: string, format: uuid }
        unit: { $ref: '#/components/schemas/NamedEntity' }
        shift: { type: string, enum: [MANHA, TARDE, NOITE, UNICO] }
        float_amount: { type: string }
        counted_cash: { type: [string, 'null'], description: Dinheiro contado no cofre ao fechar (só espécie). }
        cash_difference: { type: [string, 'null'], description: Contado menos esperado; diferente de zero exige supervisor. }
        close_note: { type: [string, 'null'], description: Justificativa da quebra, quando houver. }
        status: { type: string, enum: [ABERTO, FECHADO] }
        opened_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        last_receipt_number: { type: integer }
    Payout:
      type: object
      required: [id, professional_id, period_from, period_to, status, subtotal_gross, total_commission]
      properties:
        id: { type: string, format: uuid }
        professional_id: { type: string, format: uuid }
        professional: { $ref: '#/components/schemas/NamedEntity' }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        status: { type: string, enum: [OPEN, CONFIRMED, CONTESTED, PAID] }
        subtotal_gross: { type: string }
        total_commission: { type: string }
        contest_note: { type: [string, 'null'] }
        proof_reference: { type: [string, 'null'] }
    PayoutItem:
      type: object
      required: [id, appointment_id, gross_amount, commission_amount, rule]
      properties:
        id: { type: string, format: uuid }
        appointment_id: { type: string, format: uuid }
        gross_amount: { type: string }
        commission_amount: { type: string }
        rule: { type: string, enum: [DEFAULT_PERCENT, DEFAULT_FIXED, OVERRIDE_PERCENT, OVERRIDE_FIXED, MANUAL_ADJUST] }
    CashMovement:
      type: object
      required: [id, type, receipt_number, gross_amount, fee_amount, net_amount]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [RECEBIMENTO, SANGRIA, ESTORNO, REPASSE] }
        receipt_number: { type: integer, description: Sequencial por caixa, sem lacuna (recebimentos, sangrias e estornos consomem a sequência). }
        gross_amount: { type: string }
        fee_amount: { type: string }
        net_amount: { type: string }
        appointment_id: { type: [string, 'null'], format: uuid }
        proof_reference: { type: [string, 'null'], description: Referência do comprovante da sangria. }
        payment_method: { $ref: '#/components/schemas/PaymentMethod' }
    CheckoutReceipt:
      type: object
      required: [appointment_id, payment_status, receipt_number, method, gross_amount, fee_amount, net_amount]
      properties:
        appointment_id: { type: string, format: uuid }
        payment_status: { type: string, const: PAID }
        paid_at: { type: string, format: date-time }
        receipt_number: { type: integer }
        cash_register_id: { type: string, format: uuid }
        method: { type: object, properties: { code: { type: string }, name: { type: string } } }
        gross_amount: { type: string }
        fee_amount: { type: string }
        net_amount: { type: string }
    DashboardSummary:
      type: object
      properties:
        date: { type: string, format: date }
        patient_flow: { type: object, properties: { waiting: { type: integer }, in_care: { type: integer }, checkout: { type: integer }, finished: { type: integer } } }
        queue: { type: array, items: { type: object } }
        financials_available: { type: boolean }
    ProcedureType:
      type: string
      enum: [CONSULTATION, EXAM]
    Modality:
      type: string
      enum: [PRESENTIAL, TELECONSULTATION]
    BookAppointment:
      type: object
      required: [idempotency_key, offering_id, starts_at, patient, privacy_consent]
      properties:
        idempotency_key: { type: string, format: uuid }
        offering_id: { type: string, format: uuid }
        starts_at: { type: string, format: date-time }
        patient:
          type: object
          required: [name, cpf, phone]
          properties:
            name: { type: string }
            cpf: { type: string, description: Aceita pontuação; nunca é persistido em texto puro. }
            birth_date: { type: string, format: date }
            phone: { type: string }
            email: { type: string, format: email }
        privacy_consent: { type: boolean, const: true }
    Login:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    CurrentUser:
      type: object
      required: [id, name, email, role, role_label, permissions]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, SUPERVISOR, RECEPTION, CASHIER, MANAGER, DOCTOR] }
        role_label: { type: string }
        permissions: { type: array, items: { type: string } }
    CatalogLinkInput:
      type: object
      required: [unit_id, procedure_id, professional_id, agreement_id, active]
      properties:
        unit_id: { type: string, format: uuid }
        procedure_id: { type: string, format: uuid }
        professional_id: { type: string, format: uuid }
        agreement_id: { type: string, format: uuid }
        active: { type: boolean }
    LoyaltyPlanInput:
      type: object
      required: [name, agreement_id, monthly_fee, due_day]
      properties:
        name: { type: string, minLength: 3, maxLength: 120 }
        agreement_id: { type: string, format: uuid }
        monthly_fee: { type: number, minimum: 1 }
        due_day: { type: integer, minimum: 1, maximum: 28 }
        active: { type: boolean }
    LoyaltySubscriptionInput:
      type: object
      required: [plan_id, patient]
      properties:
        plan_id: { type: string, format: uuid }
        patient:
          type: object
          required: [cpf]
          properties:
            cpf: { type: string }
            name: { type: string, maxLength: 150 }
            birth_date: { type: [string, 'null'], format: date }
            phone: { type: [string, 'null'], maxLength: 30 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        dependents:
          type: array
          maxItems: 10
          items:
            type: object
            required: [cpf]
            properties:
              cpf: { type: string }
              name: { type: string, maxLength: 150 }
              birth_date: { type: [string, 'null'], format: date }
              phone: { type: [string, 'null'], maxLength: 30 }
    LoyaltySubscriptionUpdate:
      type: object
      properties:
        status: { type: string, enum: [ACTIVE, CANCELED, BLOCKED] }
        notes: { type: [string, 'null'], maxLength: 2000 }
        dependents:
          type: array
          maxItems: 10
          items:
            type: object
            required: [cpf]
            properties:
              cpf: { type: string }
              name: { type: string, maxLength: 150 }
    TeamUserInput:
      type: object
      required: [name, email, role, active, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, SUPERVISOR, RECEPTION] }
        active: { type: boolean }
        password: { type: [string, 'null'], minLength: 12, format: password }
    ImportIssueResolution:
      type: object
      required: [resolution_status]
      properties:
        resolution_status: { type: string, enum: [OPEN, RESOLVED, IGNORED, UNMATCHED] }
        resolution_note: { type: [string, 'null'], maxLength: 2000 }
    TeamPriceItem:
      type: object
      required: [id, procedure, agreement, nature, amount]
      properties:
        id: { type: string, format: uuid }
        procedure:
          type: object
          properties:
            id: { type: string, format: uuid }
            legacy_id: { type: string }
            tuss_code: { type: [string, 'null'] }
            name: { type: string }
        agreement:
          type: object
          properties:
            id: { type: string, format: uuid }
            legacy_id: { type: string }
            name: { type: string }
        unit:
          anyOf:
            - type: object
              properties:
                id: { type: string, format: uuid }
                legacy_id: { type: string }
                name: { type: string }
            - type: 'null'
        nature: { type: string, enum: [PRIVATE, PLAN] }
        amount: { type: string, pattern: '^\\d+\\.\\d{2}$' }
    TeamPriceResult:
      type: object
      required: [agreement_id, query, types]
      properties:
        agreement_id: { type: string, format: uuid }
        query: { type: string }
        types:
          type: array
          items:
            type: object
            properties:
              type: { $ref: '#/components/schemas/ProcedureType' }
              groups:
                type: array
                items:
                  type: object
                  properties:
                    group_name: { type: string }
                    items: { type: array, items: { $ref: '#/components/schemas/TeamPriceItem' } }
  responses:
    PatientAppointment:
      description: Reserva sem dados pessoais do paciente; Cache-Control no-store e Referrer-Policy no-referrer
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/PublicAppointment' }
    ValidationError:
      description: Dados inválidos ou disponibilidade esgotada
