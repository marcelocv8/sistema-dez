openapi: 3.1.0
info:
  title: Sistema DEZ API
  version: 0.17.0
servers:
  - url: http://localhost:8000/api/v1
paths:
  /public/services:
    get:
      summary: Lista procedimentos e ofertas disponíveis online (convênio padrão)
      description: O online exibe somente ofertas do convênio padrão com vínculo, preço e escala válidos. O parâmetro agreement_id é aceito por compatibilidade e ignorado.
      parameters:
        - { name: unit_id, in: query, schema: { type: string, format: uuid } }
        - { name: agreement_id, in: query, description: Ignorado; o online usa sempre o convênio padrão., schema: { type: string, format: uuid } }
        - { name: modality, in: query, schema: { $ref: '#/components/schemas/Modality' } }
        - { name: type, in: query, schema: { type: string, enum: [CONSULTATION, EXAM] } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Catálogo público }
        '422': { $ref: '#/components/responses/ValidationError' }
  /public/availability:
    get:
      summary: Consulta horários, blocos ou informação de demanda espontânea
      description: Apenas ofertas visíveis e elegíveis do convênio padrão. Janela de hoje até 29 dias à frente, sem vencimento de publicação; antecedência mínima de 30 minutos.
      parameters:
        - { name: procedure_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: unit_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: agreement_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: modality, in: query, required: true, schema: { $ref: '#/components/schemas/Modality' } }
        - { name: professional_id, in: query, schema: { type: string, format: uuid } }
        - { name: offering_id, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Disponibilidade por oferta e dia }
        '422': { $ref: '#/components/responses/ValidationError' }
  /public/appointments:
    post:
      summary: Cria um agendamento idempotente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookAppointment' }
      responses:
        '201': { $ref: '#/components/responses/PatientAppointment' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Limite de tentativas excedido }
  /public/appointments/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Consulta reserva pelo link privado, sem dados pessoais do paciente
      description: Token somente no cabeçalho Authorization. Nunca aceitar token em query string. Resposta no-store; acesso expira 24 horas após o atendimento. Máximo de 30 requisições por minuto/IP nas rotas de gestão.
      security: [{ managementToken: [] }]
      responses:
        '200': { $ref: '#/components/responses/PatientAppointment' }
        '404': { description: Link inválido ou expirado; não distingue reserva inexistente }
        '429': { description: Limite de tentativas excedido }
  /public/appointments/{id}/availability:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Vagas públicas da mesma oferta, desconsiderando a própria reserva
      security: [{ managementToken: [] }]
      responses:
        '200': { description: Disponibilidade por oferta e dia, com Cache-Control no-store }
        '404': { description: Link inválido ou expirado }
        '429': { description: Limite de tentativas excedido }
  /public/appointments/{id}/reschedule:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Remarca reserva futura na mesma oferta, com capacidade e preço revalidados
      description: Somente CONFIRMED antes do início. Não aceita offering_id. Aplica janela pública, antecedência e visibilidade online. Atualiza preço congelado e validade do link; audita alteração.
      security: [{ managementToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [starts_at, reason], properties: { starts_at: { type: string, format: date-time }, reason: { type: string, minLength: 3, maxLength: 1000 } } } } } }
      responses:
        '200': { $ref: '#/components/responses/PatientAppointment' }
        '404': { description: Link inválido ou expirado }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Limite de tentativas excedido }
  /public/appointments/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Cancela reserva futura com motivo, preservando histórico e liberando a vaga
      description: Repetir cancelamento já concluído é idempotente. Não exige que a oferta continue visível.
      security: [{ managementToken: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 1000 } } } } } }
      responses:
        '200': { $ref: '#/components/responses/PatientAppointment' }
        '404': { description: Link inválido ou expirado }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Limite de tentativas excedido }
  /auth/login:
    post:
      summary: Autentica um usuário da equipe por sessão stateful
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200': { description: Usuário autenticado }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { description: Limite de tentativas excedido }
  /auth/logout:
    post:
      summary: Encerra e invalida a sessão atual
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Sessão encerrada }
        '401': { description: Não autenticado }
  /me:
    get:
      summary: Retorna identidade, perfil e permissões da equipe
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Identidade atual
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/CurrentUser' } }
        '401': { description: Não autenticado }
  /team/price-options:
    get:
      summary: Lista convênios ativos e subgrupos disponíveis para consulta de preços
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Opções operacionais }
        '401': { description: Não autenticado }
        '403': { description: Sem a permissão prices.view }
  /team/prices:
    get:
      summary: Pesquisa preços vigentes e conciliados do catálogo STG
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 100 } }
        - { name: type, in: query, schema: { $ref: '#/components/schemas/ProcedureType' } }
        - { name: group, in: query, schema: { type: string, maxLength: 255 } }
        - { name: agreement_id, in: query, description: Particular é usado quando omitido., schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Resultados agrupados por tipo e subgrupo
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: '#/components/schemas/TeamPriceResult' } }
        '401': { description: Não autenticado }
        '403': { description: Sem a permissão prices.view }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/catalog/{resource}:
    parameters:
      - { name: resource, in: path, required: true, schema: { type: string, enum: [units, agreements, procedures, professionals] } }
    get:
      summary: Lista um domínio do catálogo administrativo
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Página do catálogo }
        '403': { description: Sem a permissão catalog.view }
    post:
      summary: Cria cadastro manual com auditoria
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses:
        '201': { description: Cadastro criado }
        '403': { description: Sem a permissão catalog.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/catalog/{resource}/{id}:
    parameters:
      - { name: resource, in: path, required: true, schema: { type: string, enum: [units, agreements, procedures, professionals] } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Exibe um cadastro
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Cadastro }, '404': { description: Não encontrado } }
    put:
      summary: Atualiza cadastro com auditoria antes/depois
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { '200': { description: Cadastro atualizado }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      summary: Desativa cadastro sem excluir seu histórico
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Cadastro desativado } }
  /team/catalog-link-options:
    get:
      summary: Lista entidades ativas para criação de vínculos
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Opções de vínculo }, '403': { description: Sem catalog-links.view } }
  /team/catalog-links:
    get:
      summary: Lista vínculos profissional–procedimento–convênio–unidade
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Vínculos validados } }
    post:
      summary: Cria vínculo cadastral sem publicar service_offering
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogLinkInput' } } } }
      responses: { '201': { description: Vínculo criado }, '422': { $ref: '#/components/responses/ValidationError' } }
  /team/catalog-links/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      summary: Atualiza vínculo cadastral
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CatalogLinkInput' } } } }
      responses: { '200': { description: Vínculo atualizado } }
    delete:
      summary: Desativa vínculo cadastral
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Vínculo desativado } }
  /team/users:
    get:
      summary: Lista usuários da equipe
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Usuários }, '403': { description: Exclusivo team.manage } }
    post:
      summary: Cria usuário sem senha padrão
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/TeamUserInput' } } } }
      responses: { '201': { description: Usuário criado }, '422': { $ref: '#/components/responses/ValidationError' } }
  /team/users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    put:
      summary: Atualiza perfil, situação e opcionalmente senha
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Usuário atualizado }, '422': { $ref: '#/components/responses/ValidationError' } }
    delete:
      summary: Desativa usuário preservando auditoria
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Usuário desativado }, '422': { description: Último Admin não pode ser desativado } }
  /team/import-issues:
    get:
      summary: Lista pendências da última importação STG
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Pendências reconciliáveis } }
  /team/import-issues/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
    put:
      summary: Resolve, ignora justificadamente ou reabre uma pendência
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ImportIssueResolution' } } } }
      responses: { '200': { description: Resolução registrada e auditada }, '422': { $ref: '#/components/responses/ValidationError' } }
  /team/audit-logs:
    get:
      summary: Consulta trilha administrativa imutável
      security: [{ cookieAuth: [] }]
      responses: { '200': { description: Eventos de auditoria }, '403': { description: Sem audit.view } }
  /dashboard:
    get:
      summary: Visão geral real do dia, sem módulo financeiro integrado
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Fluxo e fila do dia, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/DashboardSummary' } } } } } }
        '401': { description: Sessão necessária }
        '403': { description: Requer schedule.view }
  /team/service-offering-options:
    get:
      summary: Unidades operacionais, vínculos ativos e preços vigentes compatíveis
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: catalog_link_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Opções para configuração de oferta }
        '403': { description: Requer schedule.view }
  /team/service-offerings:
    get:
      summary: Lista ofertas internas das unidades operacionais
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: unit_id, in: query, schema: { type: string, format: uuid } }
        - { name: professional_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Ofertas com escalas e exceções, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/ServiceOffering' } } } } } } }
        '403': { description: Requer schedule.view }
    post:
      summary: Cria oferta offline a partir de vínculo e preço válidos
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceOfferingInput' } } } }
      responses:
        '201': { description: Oferta criada offline }
        '403': { description: Requer schedule.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/service-offerings/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Atualiza oferta sem trocar vínculo; preço é atualizado pela fonte selecionada
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ServiceOfferingInput' } } } }
      responses:
        '200': { description: Oferta atualizada e ocorrências recalculadas }
        '403': { description: Requer schedule.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Desativa oferta preservando agendamentos
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Oferta desativada }
        '403': { description: Requer schedule.manage }
  /team/service-offerings/{id}/visibility:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Pausa ou retoma a visibilidade online da oferta (opt-out)
      description: Requer schedule.manage. Ofertas do convênio padrão com vínculo, preço e escala válidos ficam visíveis sozinhas; esta ação apenas pausa (tira do ar) ou retoma. Toda transição é auditada.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [paused], properties: { paused: { type: boolean } } } } } }
      responses:
        '200': { description: Visibilidade atualizada e auditada }
        '403': { description: Requer schedule.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/service-offerings/{id}/schedule-windows:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Lista escalas da oferta
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Escalas }
    post:
      summary: Cria escala sem sobreposição e materializa 90 dias
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleWindowInput' } } } }
      responses:
        '201': { description: Escala criada }
        '403': { description: Requer schedule.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/service-offerings/{id}/schedule-windows/{window_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: window_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Atualiza escala pertencente à oferta
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleWindowInput' } } } }
      responses:
        '200': { description: Escala atualizada }
        '404': { description: Escala não pertence à oferta }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Desativa escala sem apagar histórico
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Escala desativada }
        '403': { description: Requer schedule.manage }
  /team/service-offerings/{id}/schedule-exceptions:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Lista exceções da oferta
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Exceções }
    post:
      summary: Bloqueia dia ou intervalo, preservando reservas existentes
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleExceptionInput' } } } }
      responses:
        '201': { description: Exceção criada }
        '403': { description: Requer schedule.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/service-offerings/{id}/schedule-exceptions/{exception_id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: exception_id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Atualiza exceção pertencente à oferta
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleExceptionInput' } } } }
      responses:
        '200': { description: Exceção atualizada }
        '404': { description: Exceção não pertence à oferta }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      summary: Libera bloqueio preservando auditoria
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Bloqueio liberado }
        '403': { description: Requer schedule.manage }
  /team/availability:
    get:
      summary: Consulta disponibilidade interna de uma oferta, até 90 dias
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: offering_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: exclude_appointment_id, in: query, schema: { type: string, format: uuid }, description: Agendamento desconsiderado na prévia de remarcação }
      responses:
        '200': { description: Mesmo agrupamento da disponibilidade pública, incluindo ofertas offline }
        '403': { description: Requer schedule.view }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/appointments:
    get:
      summary: Lista agenda interna em ordem cronológica determinística
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: unit_id, in: query, schema: { type: string, format: uuid } }
        - { name: professional_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [CONFIRMED, CHECKED_IN, DONE, CANCELLED] } }
        - { name: payment_status, in: query, schema: { type: string, enum: [PENDING, PAID, AUTHORIZED] } }
      responses:
        '200': { description: Agenda no fuso da unidade, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { date: { type: string, format: date }, appointments: { type: array, items: { $ref: '#/components/schemas/TeamAppointment' } } } } } } } } }
        '403': { description: Requer schedule.view }
    post:
      summary: Reserva interna idempotente com lock da ocorrência, origem RECEPTION e operador
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BookAppointment' } } } }
      responses:
        '201': { description: Agendamento criado, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/TeamAppointment' } } } } } }
        '403': { description: Requer appointments.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/appointments/{id}/reschedule:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Remarca agendamento confirmado e atualiza fotografia do preço
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [offering_id, starts_at, reason], properties: { offering_id: { type: string, format: uuid }, starts_at: { type: string, format: date-time }, reason: { type: string, minLength: 3, maxLength: 1000 } } } } } }
      responses:
        '200': { description: Agendamento remarcado e auditado }
        '403': { description: Requer appointments.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/appointments/{id}/cancel:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Cancela agendamento confirmado sem exclusão física
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string, minLength: 3, maxLength: 1000 } } } } } }
      responses:
        '200': { description: Agendamento cancelado e auditado }
        '403': { description: Requer appointments.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/appointments/{id}/checkout:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Cobra ficha no caixa aberto da unidade, gera recibo sequencial auditado
      description: Requer cash.operate. Ficha CONFIRMED/CHECKED_IN com pagamento PENDING; caixa ABERTO da mesma unidade; forma ativa. Valor = preço congelado + % extra da forma. Gera movimento RECEBIMENTO com recibo sem lacuna e move a fila para CHECKOUT.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [payment_method_code], properties: { payment_method_code: { type: string, enum: [ESPECIE, DEBITO, CREDITO, PIX] } } } } } }
      responses:
        '201': { description: Pagamento registrado e auditado }
        '403': { description: Requer cash.operate }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/appointments/{id}/check-in:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Registra chegada na recepção (CONFIRMED vira CHECKED_IN, entra na fila)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Check-in registrado e auditado }
        '403': { description: Requer appointments.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/appointments/{id}/start-care:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: 'Inicia atendimento clínico (trava antifraude: exige pago ou autorizado)'
      description: Requer appointments.manage. Somente CHECKED_IN com pagamento PAID ou AUTHORIZED; sem pagamento, retorna 422. Move a fila para IN_SERVICE.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Atendimento iniciado e auditado }
        '403': { description: Requer appointments.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/appointments/{id}/authorize-b2b:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Autoriza ficha B2B sem passar pelo caixa (fatura no fim do mês)
      description: Requer appointments.manage. Exige convênio empresarial ativo (não o Particular padrão) e código de autorização. Com fatura vencida em aberto da empresa, a autorização é bloqueada (422) até a regularização no módulo B2B.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [authorization_code], properties: { authorization_code: { type: string, minLength: 3, maxLength: 60 } } } } } }
      responses:
        '200': { description: Autorização registrada e auditada }
        '403': { description: Requer appointments.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/b2b-invoices:
    get:
      summary: Lista faturas B2B por competência, empresa ou situação
      description: Requer b2b.view. O campo computed_status deriva VENCIDA (emitida/enviada após o vencimento com saldo em aberto); filtro status aceita VENCIDA.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: agreement_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [EMITIDA, ENVIADA, PAGA, VENCIDA] } }
        - { name: competence, in: query, schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } }
      responses:
        '200': { description: Faturas com totais, vencimento e itens }
        '403': { description: Requer b2b.view }
  /team/b2b-invoices/generate:
    post:
      summary: Gera fatura B2B do mês por empresa a partir de atendimentos autorizados
      description: 'Requer b2b.manage. Idempotente por empresa/competência: só inclui atendimentos AUTHORIZED ainda não faturados; vencimento em 10 dias da emissão.'
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [agreement_id, competence], properties: { agreement_id: { type: string, format: uuid }, competence: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' } } } } } }
      responses:
        '201': { description: Fatura gerada (ou existente, com novos itens) e auditada }
        '403': { description: Requer b2b.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/b2b-invoices/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Detalha fatura B2B com itens (fotografia de cada atendimento)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Fatura detalhada }
        '403': { description: Requer b2b.view }
        '404': { description: Fatura inexistente }
  /team/b2b-invoices/{id}/send:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Encaminha fatura emitida à empresa
      description: Requer b2b.manage. Transição EMITIDA para ENVIADA, com registro de envio auditado.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Fatura encaminhada e auditada }
        '403': { description: Requer b2b.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/b2b-invoices/{id}/settle:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Baixa manual da fatura (parcial ou total) com comprovante
      description: Requer b2b.settle. Quita (PAGA) quando o acumulado alcança o total; valor acima do restante é rejeitado.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amount, proof_reference], properties: { amount: { type: number, minimum: 0.01 }, proof_reference: { type: string, minLength: 3, maxLength: 255 } } } } } }
      responses:
        '200': { description: Baixa registrada e auditada }
        '403': { description: Requer b2b.settle }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/queue:
    get:
      summary: Fila do dia em ordem sugerida (chegada + prioridade legal)
      description: Requer schedule.view. A chegada original (original_sequence) é preservada; suggested_position aplica a prioridade sem apagá-la.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: unit_id, in: query, schema: { type: string, format: uuid } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Fila ordenada com prioridades legais disponíveis }
        '403': { description: Requer schedule.view }
  /team/queue/history:
    get:
      summary: Últimas chamadas do painel TV no dia
      description: Requer schedule.view. Registra senha, paciente e horário de cada chamada.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: unit_id, in: query, schema: { type: string, format: uuid } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Chamadas do dia }
        '403': { description: Requer schedule.view }
  /team/queue/{id}/reorder:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Confirma prioridade legal da ficha com motivo auditado
      description: Requer appointments.manage. Toda reordenação exige motivo e é registrada sem apagar a chegada original.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [priority_reason], properties: { priority_code: { type: string, enum: [PCD, GESTANTE, LACTANTE, COLO, OBESO, IDOSO60, IDOSO80] }, priority_reason: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses:
        '200': { description: Prioridade aplicada e auditada }
        '403': { description: Requer appointments.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/queue/{id}/call:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Chama a ficha no painel TV (recepção ou médico dos próprios pacientes)
      description: Requer queue.call. O médico só chama pacientes vinculados ao seu login; a chamada é auditada e alimenta o display público.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Chamada registrada e auditada }
        '403': { description: Requer queue.call }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/schedule-conflicts:
    get:
      summary: Pendências de escala com agendamentos afetados
      description: Requer schedule.view. Lista conflitos OPEN (padrão) ou RESOLVED para resolver com médico/paciente.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [OPEN, RESOLVED] } }
        - { name: service_offering_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Pendências de escala }
        '403': { description: Requer schedule.view }
  /team/schedule-conflicts/{id}/resolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Marca pendência de escala como resolvida, com registro de como foi resolvida
      description: Requer schedule.manage.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [resolution_note], properties: { resolution_note: { type: string, minLength: 3, maxLength: 1000 } } } } } }
      responses:
        '200': { description: Pendência resolvida e auditada }
        '403': { description: Requer schedule.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/service-offerings/{id}/schedule-windows/import:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Importa escalas da planilha da recepção (validação + gravação)
      description: Requer schedule.manage. Aceita até 200 linhas no formato da tela; com dry_run valida sem gravar. Sobreposição com janelas ativas rejeita tudo.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [rows], properties: { dry_run: { type: boolean }, rows: { type: array, minItems: 1, maxItems: 200 } } } } } }
      responses:
        '201': { description: Relatório de validação ou importação auditada }
        '403': { description: Requer schedule.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /public/units:
    get:
      summary: Unidades operacionais para o painel TV
      description: Sem autenticação; retorna apenas id e nome das unidades ativas e operacionais.
      responses:
        '200': { description: Unidades operacionais }
  /public/display:
    get:
      summary: Senha atual e próximas do painel TV por unidade
      description: Sem autenticação. Expõe apenas senha, primeiro nome, procedimento e profissional — sem CPF, telefone ou sobrenome.
      parameters:
        - { name: unit_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: date, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: Chamada atual e próximas senhas }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/attendance:
    get:
      summary: Relatório de ponto por dia/usuário no período
      description: 'Requer attendance.view (exclusivo Admin e Supervisor). Cada login registra uma entrada; relogins e relogins após o horário de saída configurado aparecem sinalizados. Dados append-only.'
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: user_id, in: query, schema: { type: integer } }
      responses:
        '200': { description: Dias com entradas, saída configurada e sinalizações }
        '403': { description: Requer attendance.view }
  /team/attendance/export:
    get:
      summary: Exportação CSV do relatório de ponto
      description: Requer attendance.view. Mesmos filtros do relatório.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: CSV ponto-e-vírgula (pt-BR) }
        '403': { description: Requer attendance.view }
  /team/attendance/exit-hour:
    get:
      summary: Horário de saída configurado
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Horário atual (padrão 18:00) }
    put:
      summary: Configura o horário de saída que fecha o dia do usuário
      description: Requer team.manage (só Admin). Alteração auditada.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [exit_hour], properties: { exit_hour: { type: string, pattern: '^[0-9]{2}:[0-9]{2}$' } } } } } }
      responses:
        '200': { description: Horário atualizado e auditado }
        '403': { description: Requer team.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/chat/conversations:
    get:
      summary: Conversas do usuário com contador de não lidas
      description: Requer chat.use (todos os papéis).
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Conversas ordenadas por atividade recente }
    post:
      summary: Cria conversa 1:1 (reusa thread existente) ou grupo por setor
      description: Requer chat.use. 1:1 exige exatamente um participante além do autor; grupo exige título.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [type, participant_ids], properties: { type: { type: string, enum: [DIRECT, GROUP] }, title: { type: string, maxLength: 120 }, participant_ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 30 } } } } } }
      responses:
        '201': { description: Conversa criada ou existente reutilizada }
        '403': { description: Requer chat.use }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/chat/conversations/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      description: Sem cursor, retorna as 200 mensagens mais recentes em ordem cronológica. before_id carrega mensagens anteriores, com desempate por id; after preserva microssegundos.
      summary: Mensagens da conversa (só participantes)
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: before_id, in: query, schema: { type: string, format: uuid } }
        - { name: after, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Mensagens em ordem cronológica }
        '403': { description: Não participante }
    post:
      summary: Envia mensagem, opcionalmente vinculada a paciente/agendamento
      description: Requer chat.use. Atualiza last_read do autor.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [body], properties: { body: { type: string, maxLength: 2000 }, patient_id: { type: string, format: uuid }, appointment_id: { type: string, format: uuid } } } } } }
      responses:
        '201': { description: Mensagem enviada }
        '403': { description: Não participante }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/chat/conversations/{id}/read:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Marca a conversa como lida pelo usuário
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Confirmado }
        '403': { description: Não participante }
  /team/chat/unread:
    get:
      summary: Total de mensagens não lidas do usuário (badge)
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Contador agregado }
  /team/chat/participants:
    get:
      summary: Usuários ativos para iniciar conversas
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Diretório mínimo (id, nome, perfil) }
  /team/chat/patients/lookup:
    get:
      summary: Localiza paciente por CPF para vincular mensagem
      description: Requer chat.use. Retorna apenas id e nome.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: cpf, in: query, required: true, schema: { type: string, pattern: '^[0-9]{11}$' } }
      responses:
        '200': { description: Paciente encontrado ou null }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/budgets:
    get:
      summary: Lista orçamentos por situação/paciente
      description: Requer budgets.view (Recepção incluída).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [RASCUNHO, ENVIADO, ACEITO, RECUSADO, PERDIDO] } }
        - { name: patient_id, in: query, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Orçamentos com itens e prescrição }
        '403': { description: Requer budgets.view }
    post:
      summary: Cria orçamento (rascunho) com itens e prescrição anexada
      description: Requer budgets.manage. Preço por convênio com fotografia por item; prescrição (foto/PDF) fica fora do webroot e só é acessível com budgets.view.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [patient_id, agreement_id, unit_id, items]
              properties:
                patient_id: { type: string, format: uuid }
                agreement_id: { type: string, format: uuid }
                unit_id: { type: string, format: uuid }
                items: { type: array, minItems: 1, maxItems: 50, items: { type: object, required: [procedure_price_id, procedure_id, amount], properties: { procedure_price_id: { type: string, format: uuid }, procedure_id: { type: string, format: uuid }, amount: { type: number }, quantity: { type: integer, minimum: 1, maximum: 99 } } } }
                prescription: { type: string, format: binary, description: Foto/PDF da prescrição (≤ 10 MB) }
      responses:
        '201': { description: Orçamento criado (RASCUNHO) e auditado }
        '403': { description: Requer budgets.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/budgets/price-options:
    get:
      summary: Preços vigentes do convênio para montar itens
      description: Requer budgets.view. Busca por nome (3+ caracteres) ou código TUSS.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: agreement_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: unit_id, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: q, in: query, schema: { type: string, minLength: 3, maxLength: 100 } }
      responses:
        '200': { description: Opções com fotografia de preço }
        '403': { description: Requer budgets.view }
  /team/budgets/{id}/send:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Envia o orçamento ao paciente (envio manual; WhatsApp fora)
      description: Requer budgets.manage. RASCUNHO → ENVIADO, com sent_at para a rotina de retorno D+1.
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Enviado e auditado }
        '403': { description: Requer budgets.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/budgets/{id}/resolve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Resolve o orçamento obrigatoriamente (aceito/recusado/perdido)
      description: Requer budgets.manage. Só ENVIADO pode ser resolvido; quem resolve fica registrado; auditado.
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [outcome, note], properties: { outcome: { type: string, enum: [ACEITO, RECUSADO, PERDIDO] }, note: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses:
        '200': { description: Resolvido e auditado }
        '403': { description: Requer budgets.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/budgets/{id}/prescription:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Baixa a prescrição anexada (fora do webroot)
      description: Requer budgets.view. Servida via API com controle de acesso (LGPD §7.6).
      security: [{ cookieAuth: [] }]
      responses:
        '200': { description: Arquivo da prescrição }
        '403': { description: Requer budgets.view }
        '404': { description: Sem prescrição anexada }
  /team/routines:
    get:
      summary: Rotinas do dia (mine = atribuídas ao usuário; all = Admin/Supervisor)
      description: Requer routine.view. Pendentes e concluídas com crítica e autor.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: date, in: query, schema: { type: string, format: date } }
        - { name: scope, in: query, schema: { type: string, enum: [mine, all] } }
      responses:
        '200': { description: Tarefas do dia }
        '403': { description: Requer routine.view }
  /team/routines/generate:
    post:
      summary: Gera as rotinas do dia (idempotente)
      description: Requer routine.manage (Admin/Supervisor/Gerente). Roda às 00:20 pelo scheduler; cria confirmações de amanhã, retorno de orçamentos D+1, aniversariantes de consulta e faturas B2B vencidas.
      security: [{ cookieAuth: [] }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { date: { type: string, format: date } } } } } }
      responses:
        '201': { description: Quantidade criada }
        '403': { description: Requer routine.manage }
  /team/routines/{id}/tick:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Conclui a rotina com crítica opcional
      description: Requer routine.tick. Fica registrado quem fez, quando e a observação; auditado.
      security: [{ cookieAuth: [] }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { note: { type: string, maxLength: 1000 } } } } } }
      responses:
        '200': { description: Tick registrado }
        '403': { description: Requer routine.tick }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/routines/{id}/reopen:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Reabre rotina concluída com motivo
      description: Requer routine.manage (Admin/Supervisor/Gerente).
      security: [{ cookieAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string, minLength: 3, maxLength: 1000 } } } } } }
      responses:
        '200': { description: Reaberta e auditada }
        '403': { description: Requer routine.manage }
        '422': { $ref: '#/components/responses/ValidationError' }
  /team/reports/templates:
    get:
      summary: Biblioteca de modelos de laudo e linhas (importados do STG)
      description: Requer reports.view. 72 modelos + 9 linhas importados; filtra por procedimento/médico; para LINHA inclui content_html completo para inserção no editor.
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { name: procedure_id, in: query, schema: { type: string, format: uuid } }
        - { name: doctor_id, in: query, schema: { type: string, format: uuid } }
        - { name: legacy_type, in: query, schema: { type: string, enum: [LAUDO, LINHA] } }
      responses:
        '200': { description: Modelos ativos }
        '403': { description: Requer reports.view }
  /team/reports:
    get:
      summary: Lista laudos por consulta ou paciente
      description: Requer reports.view. patient_id = histórico completo do paciente (equivale a todoslaudo do STG).
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: appointment_id, in: query, schema: { type: string, format: uuid } }
        - { name: patient_id, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [RASCUNHO, FINALIZADO] } }
      responses:
        '200': { description: Laudos }
        '403': { description: Requer reports.view }
