; php.ini do Sistema DEZ em produção (FrankenPHP static).
; Lido via PHPRC=/opt/dez/bin (ver deploy/systemd/dez-web.service).
;
; O binário estático do FrankenPHP já embute pdo_pgsql, pgsql, mbstring, intl,
; zip, curl, fileinfo e openssl — não há extensões a instalar aqui.
;
; Atenção: opcache.validate_timestamps=0 significa que o PHP NÃO recarrega
; arquivos alterados; o deploy precisa reiniciar dez-web.service (o deploy.sh
; faz isso).

memory_limit = 256M
max_execution_time = 60
upload_max_filesize = 20M
post_max_size = 24M
date.timezone = America/Fortaleza
expose_php = 0

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 64
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = off

realpath_cache_size = 4096k
realpath_cache_ttl = 600
